<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión — GymWeb</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="gw-topbar">
        <a href="/" class="gw-brand">
            <span class="logo"><i class="bi bi-lightning-charge-fill"></i></span>
            <span>GymWeb</span>
        </a>
        <nav class="gw-nav">
            <a href="/">Inicio</a>
        </nav>
    </header>

    <main class="gw-auth-wrap">
        <div class="gw-auth-card">
            <h1><i class="bi bi-box-arrow-in-right"></i> Iniciar sesión</h1>
            <p class="sub">Ingresa a tu cuenta de GymWeb</p>

            <div id="errorBox" style="display:none; background:rgba(239,68,68,0.12); border:1px solid rgba(239,68,68,0.3); color:#fca5a5; padding:10px 14px; border-radius:10px; margin-bottom:14px; font-size:0.9rem;"></div>

            <form id="loginForm" onsubmit="return handleLogin(event)">
                <div class="gw-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="gw-input" placeholder="tu@email.com" required autocomplete="email">
                </div>
                <div class="gw-field">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" class="gw-input" placeholder="••••••••" required autocomplete="current-password" minlength="4">
                </div>
                <button type="submit" class="gw-btn primary" style="width:100%; justify-content:center; margin-top:6px;" id="loginBtn">
                    <i class="bi bi-box-arrow-in-right"></i> Entrar
                </button>
            </form>

            <div class="switch">
                ¿No tienes cuenta? <a href="/registro">Regístrate aquí</a>
            </div>

            <div class="divider"></div>

            <div style="font-size:0.82rem; color:var(--text-muted); text-align:center;">
                <strong>Cuentas de prueba:</strong><br>
                Dueño: <code>admin@gymweb.cl</code> / <code>admin123</code><br>
                Miembro: <code>maria@correo.cl</code> / <code>demo1234</code>
            </div>
        </div>
    </main>

    <div class="gw-toast-stack" id="toastStack"></div>

    <script src="/js/ui.js"></script>
    <script>
    async function handleLogin(e) {
        e.preventDefault();
        const btn = document.getElementById('loginBtn');
        const errBox = document.getElementById('errorBox');
        errBox.style.display = 'none';
        btn.disabled = true;
        btn.innerHTML = '<i class="bi bi-arrow-repeat" style="animation:spin 1s linear infinite;"></i> Entrando...';

        try {
            const res = await fetch('/api/usuarios/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: document.getElementById('email').value.trim(),
                    password: document.getElementById('password').value
                })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Error al iniciar sesión');

            if (data.rol === 'DUENO' || data.rol === 'ADMIN') {
                window.location.href = '/admin';
            } else {
                window.location.href = '/mi-cuenta';
            }
        } catch (err) {
            errBox.textContent = err.message;
            errBox.style.display = 'block';
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Entrar';
        }
        return false;
    }
    </script>
</body>
</html>
