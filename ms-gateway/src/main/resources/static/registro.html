<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta — GymWeb</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="gw-topbar">
        <a href="/" class="gw-brand">
            <span class="logo"><i class="bi bi-lightning-charge-fill"></i></span>
            <span>GymWeb</span>
        </a>
        <nav class="gw-nav">
            <a href="/">Inicio</a>
            <a href="/login">Iniciar sesión</a>
        </nav>
    </header>

    <main class="gw-auth-wrap">
        <div class="gw-auth-card" style="max-width:500px;">
            <h1><i class="bi bi-person-plus"></i> Crear cuenta</h1>
            <p class="sub">Regístrate para ser miembro del gimnasio</p>

            <div id="errorBox" style="display:none; background:rgba(239,68,68,0.12); border:1px solid rgba(239,68,68,0.3); color:#fca5a5; padding:10px 14px; border-radius:10px; margin-bottom:14px; font-size:0.9rem;"></div>

            <form id="registroForm" onsubmit="return handleRegistro(event)">
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                    <div class="gw-field">
                        <label for="nombre">Nombre *</label>
                        <input type="text" id="nombre" class="gw-input" placeholder="Juan" required>
                    </div>
                    <div class="gw-field">
                        <label for="apellido">Apellido *</label>
                        <input type="text" id="apellido" class="gw-input" placeholder="Pérez" required>
                    </div>
                </div>
                <div class="gw-field">
                    <label for="email">Email *</label>
                    <input type="email" id="email" class="gw-input" placeholder="tu@email.com" required>
                </div>
                <div class="gw-field">
                    <label for="password">Contraseña * (mínimo 4 caracteres)</label>
                    <input type="password" id="password" class="gw-input" placeholder="••••••••" required minlength="4">
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                    <div class="gw-field">
                        <label for="rut">RUT</label>
                        <input type="text" id="rut" class="gw-input" placeholder="12.345.678-9">
                    </div>
                    <div class="gw-field">
                        <label for="telefono">Teléfono</label>
                        <input type="text" id="telefono" class="gw-input" placeholder="+56 9 1234 5678">
                    </div>
                </div>
                <div class="gw-field">
                    <label for="direccion">Dirección</label>
                    <input type="text" id="direccion" class="gw-input" placeholder="Av. Principal 123">
                </div>

                <button type="submit" class="gw-btn primary" style="width:100%; justify-content:center; margin-top:6px;" id="regBtn">
                    <i class="bi bi-person-plus"></i> Crear cuenta
                </button>
            </form>

            <div class="switch">
                ¿Ya tienes cuenta? <a href="/login">Inicia sesión</a>
            </div>
        </div>
    </main>

    <div class="gw-toast-stack" id="toastStack"></div>

    <script src="/js/ui.js"></script>
    <script>
    async function handleRegistro(e) {
        e.preventDefault();
        const btn = document.getElementById('regBtn');
        const errBox = document.getElementById('errorBox');
        errBox.style.display = 'none';
        btn.disabled = true;
        btn.innerHTML = '<i class="bi bi-arrow-repeat" style="animation:spin 1s linear infinite;"></i> Creando...';

        try {
            const res = await fetch('/api/usuarios/registro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    nombre: document.getElementById('nombre').value.trim(),
                    apellido: document.getElementById('apellido').value.trim(),
                    email: document.getElementById('email').value.trim().toLowerCase(),
                    password: document.getElementById('password').value,
                    rut: document.getElementById('rut').value.trim(),
                    telefono: document.getElementById('telefono').value.trim(),
                    direccion: document.getElementById('direccion').value.trim()
                })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Error al crear cuenta');

            window.location.href = '/mi-cuenta';
        } catch (err) {
            errBox.textContent = err.message;
            errBox.style.display = 'block';
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-person-plus"></i> Crear cuenta';
        }
        return false;
    }
    </script>
</body>
</html>
